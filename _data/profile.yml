summary: >
  Ingénieur en génie hydraulique de formation, j’ai orienté mon parcours vers la
  mécanique des fluides numérique afin de me spécialiser en CFD, simulation multiphysique
  et transferts thermiques. Après une première expérience en bureau d’études hydraulique,
  j’ai intégré le Master Modélisation et Simulation en Mécanique des Fluides et Transferts
  Thermiques à l’Université Gustave Eiffel, dans le but de renforcer mes compétences en
  calcul scientifique, modélisation numérique et analyse physique des écoulements.

  Mon profil combine une base solide en hydraulique, une approche d’ingénieur orientée
  terrain et des compétences avancées en simulation numérique. À travers ce portfolio,
  je présente des projets CFD et multiphysiques portant sur les écoulements incompressibles,
  compressibles, multiphasiques, les transferts thermiques, les milieux poreux, l’acoustique
  numérique et les méthodes numériques.


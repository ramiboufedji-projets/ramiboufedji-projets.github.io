
<footer class="site-footer">

    <div>
      <strong>{{ site.data.profile.first_name }} {{ site.data.profile.last_name }}</strong>
      <p>{{ site.data.profile.role }} · {{ site.data.profile.location }}</p>

    <div class="footer-links">

      <a href="{{ site.data.profile.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      <a href="{{ site.data.profile.github }}" target="_blank" rel="noopener">GitHub</a>
    </div>

  </div>
</footer>
